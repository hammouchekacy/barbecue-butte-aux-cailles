<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a7f4e">
<title>Carnet de salle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --vert:#1a7f4e; --vert-f:#146540; --vert-c:#e2f3ea; --fond:#f4f2ec; --txt:#20242b; --gris:#5a6a80; --bord:#e3e6ea; --rouge:#c0392b; --or:#d99a1b; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fond); color:var(--txt); display:flex; flex-direction:column; }
  header { background:var(--vert); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  header h1 { font-size:1.05rem; font-weight:600; }
  header .hd-btn { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:9px; padding:6px 11px; font-size:.8rem; cursor:pointer; }
  main { flex:1; overflow-y:auto; width:100%; max-width:480px; margin:0 auto; padding:16px 14px 150px; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--bord); display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:none; background:none; padding:9px 0 8px; font-size:.68rem; color:var(--gris); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button span { font-size:1.25rem; }
  nav button.on { color:var(--vert); font-weight:700; }

  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; }
  .titre { font-size:1rem; font-weight:600; color:var(--vert); margin-bottom:4px; }
  .sub { font-size:.8rem; color:var(--gris); }
  h2 { font-size:.95rem; margin:6px 2px 10px; color:var(--gris); text-transform:uppercase; letter-spacing:.5px; }
  .btn { border:none; border-radius:11px; padding:12px 14px; font-size:.92rem; font-weight:600; cursor:pointer; background:var(--vert); color:#fff; }
  .btn.sec { background:#e8eaee; color:var(--txt); }
  .btn.danger { background:#fbe6e3; color:var(--rouge); }
  .btn.sm { padding:7px 11px; font-size:.8rem; border-radius:9px; }
  .btn.full { width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .gap { margin-top:10px; }
  .hidden { display:none !important; }
  input, select, textarea { font:inherit; font-size:.95rem; padding:9px 10px; border:1.5px solid var(--bord); border-radius:9px; background:#fafbfc; width:100%; color:var(--txt); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--vert); }
  .vide { color:#8a94a3; font-size:.9rem; text-align:center; padding:14px 0; }
  .tag { display:inline-block; font-size:.7rem; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--vert-c); color:var(--vert-f); }
  .tag.or { background:#fdf1dc; color:#8a5f10; }

  /* séance */
  .chrono { position:sticky; top:-16px; z-index:5; background:var(--vert-f); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .chrono b { font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .exo-tete { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .exo-nom { font-weight:600; font-size:1rem; }
  .icones button { background:#f1f3f5; border:none; border-radius:8px; width:32px; height:32px; font-size:.95rem; cursor:pointer; margin-left:4px; }
  table.sets { width:100%; border-collapse:collapse; }
  table.sets th { font-size:.68rem; color:var(--gris); font-weight:600; text-transform:uppercase; padding:2px 3px; }
  table.sets td { padding:3px; text-align:center; }
  table.sets td input { text-align:center; padding:8px 2px; }
  table.sets .prec { font-size:.78rem; color:var(--gris); white-space:nowrap; }
  table.sets tr.ok td input { background:var(--vert-c); border-color:#bfe3cf; }
  .num { width:26px; height:26px; line-height:26px; border-radius:50%; background:#f1f3f5; font-size:.78rem; font-weight:700; display:inline-block; }
  .coche { width:36px; height:36px; border-radius:9px; border:1.5px solid #d5d9e0; background:#fafbfc; color:#b0b7c3; font-size:1.05rem; cursor:pointer; }
  tr.ok .coche { background:var(--vert); border-color:var(--vert); color:#fff; }
  input.erreur { border-color:var(--rouge); background:#fdeeec; }
  .notes { margin-top:8px; font-size:.85rem; padding:7px 9px; }

  /* repos */
  #repos { position:fixed; left:12px; right:12px; bottom:68px; max-width:456px; margin:0 auto; background:#20242b; color:#fff; border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:10px; z-index:25; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  #repos b { font-size:1.3rem; font-variant-numeric:tabular-nums; min-width:62px; }
  #repos .bar { flex:1; height:6px; background:#46506a; border-radius:4px; overflow:hidden; }
  #repos .bar div { height:100%; background:#4cd08a; width:100%; }
  #repos button { background:#46506a; color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:.8rem; cursor:pointer; }

  /* feuille modale */
  #voile { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  #feuille { background:#fff; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 16px 26px; }
  #feuille h3 { color:var(--vert); margin-bottom:12px; font-size:1.05rem; }
  .liste-exo { max-height:46vh; overflow-y:auto; margin:10px 0; border:1px solid var(--bord); border-radius:10px; }
  .liste-exo div { padding:10px 12px; border-bottom:1px solid #eef0f3; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:.92rem; }
  .liste-exo div:last-child { border-bottom:none; }
  .liste-exo div.sel { background:var(--vert-c); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
  .chips button { flex:none; border:1.5px solid var(--bord); background:#fff; border-radius:20px; padding:5px 12px; font-size:.78rem; cursor:pointer; }
  .chips button.on { background:var(--vert); color:#fff; border-color:var(--vert); }

  /* historique / stats */
  .ligne { display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px solid #eef0f3; font-size:.9rem; gap:8px; }
  .ligne:last-child { border-bottom:none; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:12px; padding:12px 6px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .stat b { display:block; font-size:1.25rem; color:var(--vert); }
  .stat span { font-size:.7rem; color:var(--gris); }
  canvas { width:100%; height:190px; display:block; }
  .semaine { display:flex; gap:6px; justify-content:space-between; margin-top:6px; }
  .semaine div { flex:1; text-align:center; font-size:.68rem; color:var(--gris); }
  .semaine i { display:block; margin:3px auto 0; width:22px; height:22px; border-radius:50%; background:#e8eaee; }
  .semaine i.on { background:var(--vert); }

  /* médias */
  .galerie { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .galerie .m { position:relative; aspect-ratio:3/4; border-radius:9px; overflow:hidden; background:#000; }
  .galerie img, .galerie video { width:100%; height:100%; object-fit:cover; display:block; }
  .galerie .d { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:.65rem; padding:2px 5px; }
  .galerie .x { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:.75rem; cursor:pointer; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .compare img { width:100%; border-radius:9px; }
  .compare p { text-align:center; font-size:.75rem; color:var(--gris); margin-top:2px; }
  .plein { width:100%; border-radius:10px; background:#000; max-height:55vh; }
</style>
</head>
<body>

<header>
  <h1>🏋️ Carnet de salle</h1>
  <button class="hd-btn" onclick="menuDonnees()">Données</button>
</header>
<main id="vue"></main>

<div id="repos" class="hidden">
  <span>⏱</span><b id="reposT">1:30</b>
  <div class="bar"><div id="reposB"></div></div>
  <button onclick="reposAjout(-15)">−15</button><button onclick="reposAjout(15)">+15</button><button onclick="reposStop()">✕</button>
</div>

<nav id="onglets"></nav>
<div id="voile" class="hidden" onclick="if(event.target===this)fermer()"><div id="feuille"></div></div>

<script>
/* ============ BIBLIOTHÈQUE D'EXERCICES ============ */
const MUSCLES = ["Pectoraux","Dos","Épaules","Biceps","Triceps","Jambes","Abdos","Cardio"];
// t:1 = exercice chronométré (la colonne "reps" devient des secondes)
const BIBLIO = [
  ["pompes-inclinees","Pompes inclinées","Pectoraux","Banc"],["dips","Dips sur banc","Triceps","Banc"],
  ["step-ups","Step-ups","Jambes","Banc"],["squats-bulgares","Squats bulgares","Jambes","Banc"],
  ["gainage","Gainage pieds surélevés","Abdos","Banc",1],["crunchs","Crunchs sur banc","Abdos","Banc"],
  ["ecartes-poulie","Écartés à la poulie","Pectoraux","Poulie réglable"],["face-pull","Tirage visage (face pull)","Épaules","Poulie réglable"],
  ["extension-triceps","Extensions triceps à la corde","Triceps","Poulie réglable"],["curl-biceps","Curl biceps à la poulie","Biceps","Poulie réglable"],
  ["elevations-lat","Élévations latérales","Épaules","Poulie réglable"],["pallof-press","Pallof press","Abdos","Poulie réglable"],
  ["tirage-vertical","Tirage vertical","Dos","Poulie tirage"],["tirage-poitrine","Tirage poitrine prise serrée","Dos","Poulie tirage"],
  ["tirage-horizontal","Tirage horizontal (rowing)","Dos","Poulie tirage"],
  ["dc-barre","Développé couché barre","Pectoraux","Barre"],["dc-halteres","Développé couché haltères","Pectoraux","Haltères"],
  ["dc-incline","Développé incliné haltères","Pectoraux","Haltères"],["pompes","Pompes","Pectoraux","Poids du corps"],
  ["tractions","Tractions","Dos","Poids du corps"],["rowing-barre","Rowing barre","Dos","Barre"],
  ["rowing-haltere","Rowing un bras haltère","Dos","Haltères"],["souleve-de-terre","Soulevé de terre","Dos","Barre"],
  ["dev-militaire","Développé militaire","Épaules","Barre"],["dev-halteres-epaules","Développé épaules haltères","Épaules","Haltères"],
  ["oiseau","Oiseau haltères","Épaules","Haltères"],["curl-barre","Curl barre","Biceps","Barre"],
  ["curl-marteau","Curl marteau","Biceps","Haltères"],["barre-front","Barre au front","Triceps","Barre"],
  ["squat","Squat barre","Jambes","Barre"],["presse","Presse à cuisses","Jambes","Machine"],
  ["fentes","Fentes haltères","Jambes","Haltères"],["leg-curl","Leg curl","Jambes","Machine"],
  ["leg-extension","Leg extension","Jambes","Machine"],["hip-thrust","Hip thrust","Jambes","Barre"],
  ["mollets","Mollets debout","Jambes","Machine"],["releves-jambes","Relevés de jambes","Abdos","Poids du corps"],
  ["planche","Planche","Abdos","Poids du corps",1],["roue-abdos","Roue abdominale","Abdos","Roue"],
  ["course","Course à pied","Cardio","Cardio",1],["velo","Vélo","Cardio","Cardio",1],["rameur","Rameur","Cardio","Cardio",1]
].map(([id,nom,muscle,materiel,t]) => ({id,nom,muscle,materiel,t:!!t}));

const ROUTINES_DEFAUT = [
  {id:"r-banc",nom:"Banc",exos:["pompes-inclinees","dips","step-ups","squats-bulgares","gainage","crunchs"]},
  {id:"r-poulie",nom:"Poulie réglable",exos:["ecartes-poulie","face-pull","extension-triceps","curl-biceps","elevations-lat","pallof-press"]},
  {id:"r-tirage",nom:"Poulie tirage",exos:["tirage-vertical","tirage-poitrine","tirage-horizontal"]}
];

/* ============ ÉTAT ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = "carnet_v1";
let DB = (() => {
  try { const d = JSON.parse(localStorage.getItem(LS)); if (d) return d; } catch (e) {}
  return {routines:ROUTINES_DEFAUT, hist:[], custom:[], corps:[], prefs:{repos:90}, actif:null};
})();
const sauver = () => localStorage.setItem(LS, JSON.stringify(DB));
const exos = () => BIBLIO.concat(DB.custom);
const exo = id => exos().find(e => e.id === id) || {id, nom:id, muscle:"", materiel:"", t:false};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const jourStr = ts => new Date(ts).toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
const fmtDuree = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return (h ? h + "h" : "") + String(m).padStart(h?2:1,"0") + (h ? "" : " min"); };
const e1rm = (kg, r) => r > 0 ? kg * (1 + r/30) : 0;
const nb = v => parseFloat(String(v).replace(",", ".")) || 0;
let onglet = "seance";

/* ============ MÉDIAS (IndexedDB : photos et vidéos) ============ */
const idb = new Promise((ok, ko) => {
  const r = indexedDB.open("carnet-medias", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("m", {keyPath:"id"});
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const tx = async (mode, fn) => { const d = await idb; return new Promise((ok, ko) => { const t = d.transaction("m", mode); const req = fn(t.objectStore("m")); t.oncomplete = () => ok(req && req.result); t.onerror = () => ko(t.error); }); };
const mediaAdd = m => tx("readwrite", s => s.put(m));
const mediaDel = id => tx("readwrite", s => s.delete(id));
const mediaAll = () => tx("readonly", s => s.getAll()).then(a => a || []);

function reduirePhoto(file, max = 1280) {
  return new Promise(ok => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => ok(b), "image/jpeg", .85);
    };
    img.onerror = () => ok(file); img.src = u;
  });
}
async function ajouterMedia(input, kind, ref) {
  for (const f of input.files) {
    const isVid = f.type.startsWith("video");
    const blob = isVid ? f : await reduirePhoto(f);
    await mediaAdd({id:uid(), type:isVid ? "video" : "photo", kind, ref, date:Date.now(), blob});
  }
  input.value = "";
  if (kind === "corps") rendre(); else ouvrirMedias(ref);
}

/* ============ NAVIGATION ============ */
const ONGLETS = [["seance","🏋️","Séance"],["histo","📅","Historique"],["progres","📈","Progrès"],["corps","📸","Corps"],["exos","📚","Exercices"]];
function rendreOnglets() {
  $("onglets").innerHTML = ONGLETS.map(([k,i,l]) => `<button class="${k===onglet?'on':''}" onclick="aller('${k}')"><span>${i}</span>${l}</button>`).join("");
}
function aller(k) { onglet = k; rendre(); $("vue").scrollTop = 0; }
function rendre() {
  rendreOnglets();
  ({seance:vueSeance, histo:vueHisto, progres:vueProgres, corps:vueCorps, exos:vueExos})[onglet]();
}
function ouvrir(html) { $("feuille").innerHTML = html; $("voile").classList.remove("hidden"); }
function fermer() { $("voile").classList.add("hidden"); $("feuille").innerHTML = ""; }

/* ============ SÉANCE ============ */
function precedent(id) {
  for (let i = DB.hist.length - 1; i >= 0; i--) {
    const e = DB.hist[i].exos.find(x => x.id === id);
    if (e) { const s = e.sets.filter(x => x.ok); if (s.length) return s; }
  }
  return [];
}
function demarrer(routineId) {
  const r = DB.routines.find(x => x.id === routineId);
  DB.actif = {debut:Date.now(), nom:r ? r.nom : "Séance libre", exos:(r ? r.exos : []).map(nouvelExo)};
  sauver(); rendre();
}
function nouvelExo(id) {
  const p = precedent(id), n = Math.max(3, p.length);
  return {id, notes:"", sets:Array.from({length:n}, (_, i) => ({kg:p[i] ? p[i].kg : "", reps:p[i] ? p[i].reps : "", ok:false}))};
}
function vueSeance() {
  const a = DB.actif;
  if (!a) {
    const sem = semaineStats();
    $("vue").innerHTML = `
      <div class="stats">
        <div class="stat"><b>${sem.n}</b><span>séances (7 j)</span></div>
        <div class="stat"><b>${Math.round(sem.vol/1000*10)/10} t</b><span>volume (7 j)</span></div>
        <div class="stat"><b>${DB.hist.length}</b><span>séances en tout</span></div>
      </div>
      <h2>Démarrer</h2>
      <button class="btn full" onclick="demarrer()">+ Séance vide</button>
      <h2 style="margin-top:18px">Mes routines</h2>
      ${DB.routines.map(r => `<div class="card"><div class="exo-tete"><div><div class="titre">${esc(r.nom)}</div>
        <div class="sub">${r.exos.map(i => esc(exo(i).nom)).join(" · ")}</div></div>
        <div class="icones"><button onclick="editerRoutine('${r.id}')">✏️</button></div></div>
        <button class="btn full" onclick="demarrer('${r.id}')">Démarrer</button></div>`).join("") || '<div class="vide">Aucune routine.</div>'}
      <button class="btn sec full" onclick="editerRoutine()">+ Nouvelle routine</button>`;
    return;
  }
  const tot = a.exos.reduce((s, e) => s + e.sets.length, 0), ok = a.exos.reduce((s, e) => s + e.sets.filter(x => x.ok).length, 0);
  $("vue").innerHTML = `
    <div class="chrono"><div><div style="font-size:.75rem;opacity:.8">${esc(a.nom)}</div><b id="chronoT">0:00</b></div>
      <div style="text-align:right;font-size:.8rem">${ok}/${tot} séries<br>${Math.round(volume(a.exos)).toLocaleString("fr-FR")} kg</div></div>
    ${a.exos.map((e, xi) => carteExo(e, xi)).join("") || '<div class="vide">Ajoute un premier exercice.</div>'}
    <button class="btn sec full" onclick="choisirExos()">+ Ajouter un exercice</button>
    <div class="row gap"><button class="btn danger" onclick="abandonner()">Abandonner</button><button class="btn" onclick="terminer()">Terminer ✓</button></div>`;
  tickChrono();
}
function carteExo(e, xi) {
  const x = exo(e.id), p = precedent(e.id), u = x.t ? "sec" : "reps";
  return `<div class="card">
    <div class="exo-tete"><div><div class="exo-nom">${esc(x.nom)}</div><div class="sub">${esc(x.muscle)} · ${esc(x.materiel)}</div></div>
      <div class="icones"><button title="Démo vidéo" onclick="ouvrirMedias('${e.id}')">🎬</button><button title="Retirer" onclick="retirerExo(${xi})">🗑</button></div></div>
    <table class="sets"><tr><th>Série</th><th>Précédent</th><th>kg</th><th>${u}</th><th></th></tr>
    ${e.sets.map((s, si) => `<tr class="${s.ok?'ok':''}"><td><span class="num">${si+1}</span></td>
      <td class="prec">${p[si] ? p[si].kg + " × " + p[si].reps : "–"}</td>
      <td><input inputmode="decimal" value="${esc(s.kg)}" placeholder="${p[si]?p[si].kg:''}" onchange="majSet(${xi},${si},'kg',this.value)"></td>
      <td><input inputmode="numeric" value="${esc(s.reps)}" placeholder="${p[si]?p[si].reps:''}" onchange="majSet(${xi},${si},'reps',this.value)"></td>
      <td><button class="coche" onclick="cocher(${xi},${si})">✓</button></td></tr>`).join("")}</table>
    <div class="row gap"><button class="btn sec sm" onclick="ajoutSet(${xi})">+ Série</button>
      <button class="btn sec sm" onclick="calcDisques(${xi})">🧮 Disques</button></div>
    <input class="notes" placeholder="Notes (réglage, ressenti…)" value="${esc(e.notes)}" onchange="DB.actif.exos[${xi}].notes=this.value;sauver()">
  </div>`;
}
const volume = list => list.reduce((s, e) => s + (exo(e.id).t ? 0 : e.sets.filter(x => x.ok).reduce((t, x) => t + nb(x.kg) * nb(x.reps), 0)), 0);
function majSet(xi, si, k, v) { DB.actif.exos[xi].sets[si][k] = v; sauver(); }
function cocher(xi, si) {
  const s = DB.actif.exos[xi].sets[si];
  const p = precedent(DB.actif.exos[xi].id)[si];
  if (!s.ok) {
    if (s.kg === "" && p) s.kg = p.kg; if (s.reps === "" && p) s.reps = p.reps;
    const x = exo(DB.actif.exos[xi].id), sansCharge = x.t || ["Poids du corps","Banc","Cardio"].includes(x.materiel);
    const manque = nb(s.reps) <= 0 ? "reps" : (!sansCharge && s.kg === "" ? "kg" : "");
    if (manque) {
      sauver(); rendre();
      const champ = document.querySelectorAll(".card")[xi + 0].querySelectorAll("table.sets tr")[si + 1].querySelectorAll("input")[manque === "kg" ? 0 : 1];
      champ.classList.add("erreur"); champ.focus();

function courbe(cv, pts, couleur = "#1a7f4e") {

  c.strokeStyle = couleur; c.lineWidth = 2.5; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.stroke();

  c.fillStyle = "#8a94a3"; [pts[0], pts[pts.length-1]].forEach((p, i) => { c.textAlign = i ? "right" : "left"; c.fillText(new Date(p[0]).toLocaleDateString("fr-FR", {day:"numeric", month:"short"}), i ? W-6 : 34, H-6); });
}

  const perfs = DB.hist.filter(h => h.exos.some(e => e.id === id)).slice(-3).reverse();
  const tous = DB.hist.flatMap(h => h.exos.filter(e => e.id === id).flatMap(e => e.sets));
  const rec = tous.length ? Math.max(...tous.map(t => nb(t.kg))) : 0;
  const dansSeance = DB.actif && DB.actif.exos.some(e => e.id === id);
  const action = dansSeance ? "" : `<button class="btn full gap" onclick="ajouterAuCarnet('${id}')">${DB.actif ? "+ Ajouter à la séance en cours" : "▶ Démarrer une séance avec cet exercice"}</button>`;
  ouvrir(`<h3>🎬 ${esc(x.nom)}</h3>
    <div><span class="tag">${esc(x.muscle)}</span> <span class="tag or">${esc(x.materiel)}</span>${rec ? ` <span class="tag">🏆 record ${rec} kg</span>` : ""}</div>
    ${action}
    ${perfs.length ? `<h2 style="margin-top:16px">Dernières séances</h2>${perfs.map(h => `<div class="ligne"><span>${jourStr(h.fin)}</span><b>${h.exos.find(e => e.id === id).sets.map(t => (t.kg || 0) + "×" + (t.reps || 0)).join(" · ")}</b></div>`).join("")}` : ""}
    <a class="btn full gap" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">▶ Voir une démo (YouTube)</a>
    <h2 style="margin-top:16px">Mes vidéos et photos</h2>
    <div class="row"><label class="btn sec sm" style="text-align:center">🎥 Filmer<input type="file" accept="video/*" capture="environment" hidden onchange="ajouterMedia(this,'exo','${id}')"></label>
    <label class="btn sec sm" style="text-align:center">🖼 Importer<input type="file" accept="image/*,video/*" multiple hidden onchange="ajouterMedia(this,'exo','${id}')"></label></div>
    <div class="galerie gap">${l.map(m => { const u = URL.createObjectURL(m.blob); return `<div class="m">${m.type === "photo" ? `<img src="${u}">` : `<video src="${u}" controls playsinline></video>`}
      <div class="d">${new Date(m.date).toLocaleDateString("fr-FR")}</div><button class="x" onclick="mediaDel('${m.id}').then(()=>ouvrirMedias('${id}'))">✕</button></div>`; }).join("")}</div>
    ${l.length ? "" : '<div class="vide">Filme ta technique pour la comparer plus tard.</div>'}
    <button class="btn sec full gap" onclick="fermer()">Fermer</button>`);
}

function ajouterAuCarnet(id) {
  if (!DB.actif) DB.actif = {debut:Date.now(), nom:"Séance libre", exos:[]};
  DB.actif.exos.push(nouvelExo(id)); sauver(); fermer(); aller("seance");
}

/* ============ DONNÉES : réglages, export / import ============ */
function menuDonnees() {
  ouvrir(`<h3>Réglages &amp; données</h3>
    <div class="sub">Temps de repos automatique après chaque série</div>
    <select onchange="DB.prefs.repos=+this.value;sauver()">${[[0,"Désactivé"],[45,"45 s"],[60,"1 min"],[90,"1 min 30"],[120,"2 min"],[180,"3 min"]].map(([v,l]) => `<option value="${v}" ${DB.prefs.repos===v?'selected':''}>${l}</option>`).join("")}</select>
    <div class="card gap"><div class="sub">Les séances et mesures restent sur cet appareil. Exporte une sauvegarde de temps en temps (photos et vidéos non incluses).</div>
    <div class="row gap"><button class="btn sec" onclick="exporter()">⬇ Exporter</button>
    <label class="btn sec" style="text-align:center">⬆ Importer<input type="file" accept=".json" hidden onchange="importer(this)"></label></div></div>
    <button class="btn sec full" onclick="fermer()">Fermer</button>`);
}
function exporter() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], {type:"application/json"}));
  a.download = "carnet-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
}
function importer(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!d.hist || !d.routines) throw 0; if (!confirm("Remplacer toutes les données actuelles ?")) return; DB = d; sauver(); fermer(); rendre(); })
    .catch(() => alert("Fichier invalide."));
}

rendre();
</script>
</body>
</html>
