<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<title>Pointage — Butte aux Cailles</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f4f2ec; color:#20242b; display:flex; flex-direction:column;
  }
  header {
    background:#1F4E79; color:#fff; padding:14px 18px; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  header h1 { font-size:1.05rem; font-weight:600; letter-spacing:.3px; }
  header .sub { font-size:.78rem; opacity:.85; margin-top:2px; }
  main { flex:1; width:100%; max-width:430px; margin:0 auto; padding:20px 16px 30px; }
  .hidden { display:none !important; }

  .card {
    background:#fff; border-radius:14px; padding:18px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:14px;
  }
  .titre { font-size:1rem; font-weight:600; color:#1F4E79; margin-bottom:12px; }

  /* ---- Écran profil ---- */
  .choix { display:flex; flex-direction:column; gap:9px; }
  .choix button {
    padding:14px; font-size:1.02rem; border:1.5px solid #d5d9e0; border-radius:11px;
    background:#fafbfc; cursor:pointer; text-align:left; font-weight:500; color:#20242b;
  }
  .choix button:active { background:#e8eef6; border-color:#1F4E79; }
  .lien-retour { margin-top:14px; background:none; border:none; color:#5a6a80; font-size:.9rem; text-decoration:underline; cursor:pointer; }

  /* ---- Écran principal ---- */
  .bonjour { text-align:center; margin:6px 0 4px; font-size:1.25rem; font-weight:600; }
  .resto { text-align:center; color:#5a6a80; font-size:.9rem; margin-bottom:14px; }
  .horloge { text-align:center; font-variant-numeric:tabular-nums; font-size:2.6rem; font-weight:700; color:#1F4E79; }
  .date { text-align:center; color:#5a6a80; font-size:.92rem; margin-bottom:20px; text-transform:capitalize; }

  .btn-pointage {
    display:block; width:100%; padding:22px; border:none; border-radius:16px;
    font-size:1.25rem; font-weight:700; color:#fff; cursor:pointer; margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  .btn-pointage small { display:block; font-weight:400; font-size:.82rem; opacity:.9; margin-top:4px; }
  .btn-arrivee { background:#1a7f4e; }
  .btn-arrivee:active { background:#146540; }
  .btn-depart { background:#b3372f; }
  .btn-depart:active { background:#8f2b25; }
  .btn-pointage:disabled { opacity:.55; }

  /* ---- Modal ---- */
  .voile {
    position:fixed; inset:0; background:rgba(20,26,34,.55); display:flex;
    align-items:center; justify-content:center; padding:24px; z-index:50;
  }
  .modal { background:#fff; border-radius:16px; padding:22px; width:100%; max-width:340px; text-align:center; }
  .modal h2 { font-size:1.1rem; margin-bottom:8px; }
  .modal p { color:#4a5568; font-size:.95rem; margin-bottom:18px; }
  .modal .actions { display:flex; gap:10px; }
  .modal .actions button { flex:1; padding:13px; border-radius:11px; border:none; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-annuler { background:#e8eaee; color:#20242b; }
  .btn-confirmer { background:#1F4E79; color:#fff; }

  /* ---- Statut / résultat ---- */
  .statut { text-align:center; padding:10px 0; }
  .statut .rond {
    width:74px; height:74px; border-radius:50%; margin:0 auto 14px; display:flex;
    align-items:center; justify-content:center; font-size:2.2rem; color:#fff;
  }
  .rond-ok { background:#1a7f4e; }
  .rond-attention { background:#c98a1b; }
  .rond-attente { background:#5a6a80; }
  .statut h2 { font-size:1.15rem; margin-bottom:6px; }
  .statut p { color:#4a5568; font-size:.93rem; line-height:1.45; }
  .statut .heure-pointee { font-size:1.7rem; font-weight:700; color:#1F4E79; margin:8px 0; font-variant-numeric:tabular-nums; }
  .btn-fermer { margin-top:18px; width:100%; padding:14px; border:none; border-radius:11px; background:#1F4E79; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }

  .spin {
    width:34px; height:34px; border:4px solid #d5d9e0; border-top-color:#1F4E79;
    border-radius:50%; margin:0 auto 14px; animation:sp 1s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ---- Historique ---- */
  .histo { list-style:none; }
  .histo li {
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 2px; border-bottom:1px solid #eef0f3; font-size:.92rem;
  }
  .histo li:last-child { border-bottom:none; }
  .badge { font-size:.76rem; font-weight:600; padding:3px 9px; border-radius:20px; }
  .badge-arrivee { background:#e2f3ea; color:#146540; }
  .badge-depart { background:#f7e3e1; color:#8f2b25; }
  .badge-attente { background:#fdf1dc; color:#8a5f10; }
  .vide { color:#8a94a3; font-size:.9rem; text-align:center; padding:8px 0; }

  footer { text-align:center; padding:0 0 26px; }
  footer button { background:none; border:none; color:#8a94a3; font-size:.84rem; text-decoration:underline; cursor:pointer; }

  .bandeau-attente {
    background:#fdf1dc; color:#8a5f10; font-size:.85rem; padding:10px 14px;
    border-radius:11px; margin-bottom:14px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1 id="titreApp">Pointage du personnel</h1>
  <div class="sub">Butte aux Cailles — Paris 13ᵉ</div>
</header>

<main>
  <!-- ÉCRAN 1 : choix du restaurant -->
  <section id="ecranResto" class="hidden">
    <div class="card">
      <div class="titre">Bienvenue ! Quel est ton restaurant ?</div>
      <div class="choix" id="listeRestos"></div>
    </div>
  </section>

  <!-- ÉCRAN 2 : choix du nom -->
  <section id="ecranNom" class="hidden">
    <div class="card">
      <div class="titre">Qui es-tu ?</div>
      <div class="choix" id="listeNoms"></div>
      <div class="vide hidden" id="nomsVide">Chargement de la liste…</div>
      <button class="lien-retour" onclick="allerEcranResto()">← Changer de restaurant</button>
    </div>
  </section>

  <!-- ÉCRAN 2bis : code personnel -->
  <section id="ecranCode" class="hidden">
    <div class="card">
      <div class="titre" id="codeTitre">Ton code personnel</div>
      <input id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="• • • •" autocomplete="off"
             style="width:100%;padding:14px;font-size:1.6rem;text-align:center;letter-spacing:8px;border:1.5px solid #d5d9e0;border-radius:11px;margin-bottom:10px;">
      <div id="codeErreur" class="hidden" style="color:#b3372f;font-size:.9rem;text-align:center;margin-bottom:10px;">Code incorrect. Réessaie ou vois avec la direction.</div>
      <button class="btn-fermer" style="margin-top:4px" onclick="validerCode()">Valider</button>
      <button class="lien-retour" onclick="allerEcranNom()">← Retour</button>
    </div>
  </section>

  <!-- ÉCRAN 3 : pointage -->
  <section id="ecranPointage" class="hidden">
    <div class="bandeau-attente hidden" id="bandeauAttente"></div>
    <div class="bonjour" id="lblBonjour"></div>
    <div class="resto" id="lblResto"></div>
    <div class="horloge" id="horloge">--:--</div>
    <div class="date" id="dateJour"></div>

    <button class="btn-pointage btn-arrivee" id="btnArrivee">
      ✓ OK — Début de service
      <small>J'arrive dans l'établissement</small>
    </button>
    <button class="btn-pointage btn-depart" id="btnDepart">
      ✓ OK — Fin de service
      <small>Je quitte l'établissement</small>
    </button>

    <div class="card">
      <div class="titre">Mes derniers pointages</div>
      <ul class="histo" id="histoListe"></ul>
      <div class="vide hidden" id="histoVide">Aucun pointage pour l'instant.</div>
    </div>

    <footer>
      <button onclick="changerProfil()">Changer de profil</button>
    </footer>
  </section>
</main>

<!-- Modal confirmation -->
<div class="voile hidden" id="voileConfirm">
  <div class="modal">
    <h2 id="confirmTitre"></h2>
    <p id="confirmTexte"></p>
    <div class="actions">
      <button class="btn-annuler" onclick="fermerConfirm()">Annuler</button>
      <button class="btn-confirmer" id="btnConfirmer">Confirmer</button>
    </div>
  </div>
</div>

<!-- Modal progression / résultat -->
<div class="voile hidden" id="voileStatut">
  <div class="modal">
    <div class="statut" id="statutContenu"></div>
  </div>
</div>

<script>
/* ================= CONFIGURATION =================
   Les 3 valeurs FORM_ACTION, ENTRIES et EMPLOYES_CSV
   sont remplies lors de la mise en place du Google Sheet. */
const CONFIG = {
  FORM_ACTION: "https://docs.google.com/forms/d/e/1FAIpQLSeUM1unvPCgd9tvp4hXr5NifwFexzRDQbVcKbQTogkvgTPNqw/formResponse",
  ENTRIES: {
    employe:      "entry.734536663",
    restaurant:   "entry.478511814",
    action:       "entry.92191168",
    localisation: "entry.1789622354"
  },
  EMPLOYES_CSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6oPBgPit_BDcvF9VIK-Vx_fo59vZoGhckmj1b487xgzRFS8XcTNE-IJVAe3xnxL5vutth2VKMnInJ/pub?gid=506935648&single=true&output=csv",
  ZONE: { lat: 48.82773, lon: 2.35036, rayon: 150 },  // 11-13 rue de la Butte aux Cailles
  RESTAURANTS: ["L'Olivier", "Le Merle", "JBC"]
};
/* ================================================= */

const $ = id => document.getElementById(id);
const LS_PROFIL = "pointage_profil";
const LS_HISTO  = "pointage_histo";
const LS_QUEUE  = "pointage_queue";
const LS_CACHE_EMP = "pointage_employes";

let profil = JSON.parse(localStorage.getItem(LS_PROFIL) || "null");
let restoChoisi = null;
let actionEnCours = null;
let envoiEnCours = false;

/* ---------- Navigation écrans ---------- */
function montrer(ecran) {
  ["ecranResto","ecranNom","ecranCode","ecranPointage"].forEach(e => $(e).classList.add("hidden"));
  $(ecran).classList.remove("hidden");
}
let candidat = null;
function allerEcranResto() {
  const div = $("listeRestos");
  div.innerHTML = "";
  CONFIG.RESTAURANTS.forEach(r => {
    const b = document.createElement("button");
    b.textContent = r;
    b.onclick = () => { restoChoisi = r; allerEcranNom(); };
    div.appendChild(b);
  });
  montrer("ecranResto");
}
async function allerEcranNom() {
  montrer("ecranNom");
  $("listeNoms").innerHTML = "";
  $("nomsVide").classList.remove("hidden");
  $("nomsVide").textContent = "Chargement de la liste…";
  const employes = await chargerEmployes();
  const liste = employes.filter(e => !e.restaurant || e.restaurant === restoChoisi);
  $("nomsVide").classList.add("hidden");
  if (!liste.length) {
    $("nomsVide").textContent = "Liste des employés indisponible. Vérifie ta connexion ou vois avec la direction.";
    $("nomsVide").classList.remove("hidden");
    return;
  }
  liste.forEach(e => {
    const b = document.createElement("button");
    b.textContent = e.nom;
    b.onclick = () => {
      candidat = { nom: e.nom, restaurant: restoChoisi, code: e.code || "" };
      if (!candidat.code) { enregistrerProfil(); }
      else { allerEcranCode(); }
    };
    $("listeNoms").appendChild(b);
  });
}
function enregistrerProfil() {
  profil = candidat;
  localStorage.setItem(LS_PROFIL, JSON.stringify(profil));
  allerEcranPointage();
}
function allerEcranCode() {
  $("codeTitre").textContent = candidat.nom + " — ton code personnel";
  $("codeInput").value = "";
  $("codeErreur").classList.add("hidden");
  montrer("ecranCode");
  $("codeInput").focus();
}
function validerCode() {
  if ($("codeInput").value.trim() === candidat.code) { enregistrerProfil(); }
  else {
    $("codeErreur").classList.remove("hidden");
    $("codeInput").value = "";
    $("codeInput").focus();
  }
}
function allerEcranPointage() {
  $("lblBonjour").textContent = "Bonjour " + profil.nom + " 👋";
  $("lblResto").textContent = profil.restaurant;
  montrer("ecranPointage");
  rafraichirHisto();
  rafraichirBandeau();
  renvoyerQueue();
}
function changerProfil() {
  if (!confirm("Changer de profil ? (à faire uniquement si ce n'est pas ton téléphone habituel)")) return;
  localStorage.removeItem(LS_PROFIL);
  profil = null;
  allerEcranResto();
}

/* ---------- Liste des employés (onglet Google Sheet publié en CSV) ---------- */
async function chargerEmployes() {
  if (CONFIG.EMPLOYES_CSV) {
    try {
      const r = await fetch(CONFIG.EMPLOYES_CSV, { cache: "no-store" });
      const txt = await r.text();
      const lignes = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const emp = [];
      for (const l of lignes) {
        const [nom, restaurant, code] = l.split(/[\t,;]/).map(c => c.replace(/^"|"$/g, "").trim());
        if (!nom || /^nom$/i.test(nom)) continue;   // saute l'en-tête
        emp.push({ nom, restaurant: restaurant || "", code: code || "" });
      }
      if (emp.length) {
        localStorage.setItem(LS_CACHE_EMP, JSON.stringify(emp));
        return emp;
      }
    } catch (e) { /* réseau indisponible → cache */ }
  }
  return JSON.parse(localStorage.getItem(LS_CACHE_EMP) || "[]");
}

/* ---------- Horloge ---------- */
function tick() {
  const n = new Date();
  $("horloge").textContent = n.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  $("dateJour").textContent = n.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
}
setInterval(tick, 1000); tick();

/* ---------- Pointage ---------- */
$("btnArrivee").onclick = () => ouvrirConfirm("Début de service");
$("btnDepart").onclick  = () => ouvrirConfirm("Fin de service");

function ouvrirConfirm(action) {
  actionEnCours = action;
  const h = new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  $("confirmTitre").textContent = action;
  $("confirmTexte").textContent = profil.nom + " — " + profil.restaurant + "\nConfirmer le pointage de " + h + " ?";
  $("voileConfirm").classList.remove("hidden");
}
function fermerConfirm() { $("voileConfirm").classList.add("hidden"); }
$("btnConfirmer").onclick = () => { fermerConfirm(); lancerPointage(actionEnCours); };

function distanceMetres(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function afficherStatut(html) {
  $("statutContenu").innerHTML = html;
  $("voileStatut").classList.remove("hidden");
}
function fermerStatut() { $("voileStatut").classList.add("hidden"); }

async function lancerPointage(action) {
  if (envoiEnCours) return;
  envoiEnCours = true;
  $("btnArrivee").disabled = $("btnDepart").disabled = true;
  afficherStatut('<div class="spin"></div><h2>Localisation en cours…</h2><p>Vérifie que la localisation est activée.</p>');

  let pos = null;
  try {
    pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:true, timeout:15000, maximumAge:0 })
    );
  } catch (e) { /* refusée ou indisponible → pointage quand même, signalé */ }

  let lat = "", lon = "", prec = "", dist = "", statut = "SANS GPS";
  if (pos) {
    lat  = pos.coords.latitude.toFixed(6);
    lon  = pos.coords.longitude.toFixed(6);
    prec = Math.round(pos.coords.accuracy);
    dist = distanceMetres(pos.coords.latitude, pos.coords.longitude, CONFIG.ZONE.lat, CONFIG.ZONE.lon);
    statut = (dist <= CONFIG.ZONE.rayon + Math.min(prec, 100)) ? "OK" : "HORS ZONE";
  }

  const p = {
    horodatage: new Date().toISOString(),
    heureLocale: new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }),
    nom: profil.nom, restaurant: profil.restaurant, action,
    lat, lon, prec, dist, statut
  };

  afficherStatut('<div class="spin"></div><h2>Enregistrement…</h2><p></p>');
  const envoye = await envoyerFormulaire(p);

  ajouterHisto({ ...p, envoye });
  if (!envoye) ajouterQueue(p);

  if (envoye && statut === "OK") {
    afficherStatut(
      '<div class="rond rond-ok">✓</div><h2>' + action + ' enregistré</h2>' +
      '<div class="heure-pointee">' + p.heureLocale + '</div>' +
      '<p>' + profil.nom + ' — ' + profil.restaurant + '<br>Position vérifiée ✓</p>' +
      '<button class="btn-fermer" onclick="fermerStatut()">Fermer</button>'
    );
  } else if (envoye) {
    const msg = statut === "HORS ZONE"
      ? "Tu sembles être à " + dist + " m de l'établissement.<br>Le pointage est enregistré mais signalé « hors zone »."
      : "Position GPS indisponible.<br>Le pointage est enregistré mais signalé « sans GPS ».<br>Pense à activer la localisation.";
    afficherStatut(
      '<div class="rond rond-attention">!</div><h2>' + action + ' enregistré</h2>' +
      '<div class="heure-pointee">' + p.heureLocale + '</div>' +
      '<p>' + msg + '</p>' +
      '<button class="btn-fermer" onclick="fermerStatut()">Fermer</button>'
    );
  } else {
    afficherStatut(
      '<div class="rond rond-attente">⏳</div><h2>Pointage mémorisé</h2>' +
      '<div class="heure-pointee">' + p.heureLocale + '</div>' +
      '<p>Pas de connexion internet pour l\'instant.<br>Il sera transmis automatiquement à la prochaine ouverture de l\'application.</p>' +
      '<button class="btn-fermer" onclick="fermerStatut()">Fermer</button>'
    );
  }

  envoiEnCours = false;
  $("btnArrivee").disabled = $("btnDepart").disabled = false;
  rafraichirHisto();
  rafraichirBandeau();
}

async function envoyerFormulaire(p) {
  if (!CONFIG.FORM_ACTION) return false;
  let loc = p.statut;
  if (p.lat) loc += " - " + p.dist + " m - " + p.lat + "," + p.lon + " ±" + p.prec + "m";
  if (p.heurePointage) loc += " (pointé à " + p.heurePointage + ", transmis plus tard)";
  const d = new URLSearchParams();
  d.append(CONFIG.ENTRIES.employe, p.nom);
  d.append(CONFIG.ENTRIES.restaurant, p.restaurant);
  d.append(CONFIG.ENTRIES.action, p.action);
  d.append(CONFIG.ENTRIES.localisation, loc);
  try {
    await fetch(CONFIG.FORM_ACTION, { method:"POST", mode:"no-cors", body:d });
    return true;
  } catch (e) { return false; }
}

/* ---------- File d'attente hors connexion ---------- */
function ajouterQueue(p) {
  const q = JSON.parse(localStorage.getItem(LS_QUEUE) || "[]");
  q.push({ ...p, heurePointage: p.heureLocale + " le " + new Date(p.horodatage).toLocaleDateString("fr-FR") });
  localStorage.setItem(LS_QUEUE, JSON.stringify(q));
}
async function renvoyerQueue() {
  let q = JSON.parse(localStorage.getItem(LS_QUEUE) || "[]");
  if (!q.length) return;
  const restants = [];
  for (const p of q) {
    const ok = await envoyerFormulaire(p);
    if (!ok) restants.push(p);
    else marquerHistoEnvoye(p.horodatage);
  }
  localStorage.setItem(LS_QUEUE, JSON.stringify(restants));
  rafraichirHisto();
  rafraichirBandeau();
}
function rafraichirBandeau() {
  const q = JSON.parse(localStorage.getItem(LS_QUEUE) || "[]");
  const b = $("bandeauAttente");
  if (q.length) {
    b.textContent = "⏳ " + q.length + " pointage(s) en attente de connexion — ils partiront automatiquement.";
    b.classList.remove("hidden");
  } else b.classList.add("hidden");
}

/* ---------- Historique local ---------- */
function ajouterHisto(p) {
  const h = JSON.parse(localStorage.getItem(LS_HISTO) || "[]");
  h.unshift(p);
  localStorage.setItem(LS_HISTO, JSON.stringify(h.slice(0, 30)));
}
function marquerHistoEnvoye(horodatage) {
  const h = JSON.parse(localStorage.getItem(LS_HISTO) || "[]");
  const it = h.find(x => x.horodatage === horodatage);
  if (it) it.envoye = true;
  localStorage.setItem(LS_HISTO, JSON.stringify(h));
}
function rafraichirHisto() {
  const h = JSON.parse(localStorage.getItem(LS_HISTO) || "[]").filter(x => x.nom === profil.nom);
  const ul = $("histoListe");
  ul.innerHTML = "";
  $("histoVide").classList.toggle("hidden", h.length > 0);
  h.slice(0, 8).forEach(x => {
    const li = document.createElement("li");
    const d = new Date(x.horodatage);
    const badge = !x.envoye ? "badge-attente" : (x.action === "Début de service" ? "badge-arrivee" : "badge-depart");
    const lbl = !x.envoye ? "en attente" : (x.action === "Début de service" ? "Arrivée" : "Départ");
    li.innerHTML =
      "<span>" + d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" }) + " · <strong>" + x.heureLocale + "</strong></span>" +
      '<span class="badge ' + badge + '">' + lbl + "</span>";
    ul.appendChild(li);
  });
}

/* ---------- Démarrage ---------- */
if (profil) allerEcranPointage();
else allerEcranResto();

(async () => {
  /* Inscription automatique via QR personnalisé : pointage.html?e=Nom&c=Code */
  const params = new URLSearchParams(location.search);
  const pNom = (params.get("e") || "").trim(), pCode = (params.get("c") || "").trim();
  if (pNom && (!profil || profil.nom !== pNom)) {
    const emp = await chargerEmployes();
    const e = emp.find(x => x.nom.toLowerCase() === pNom.toLowerCase());
    if (e && (!e.code || e.code === pCode)) {
      profil = { nom: e.nom, restaurant: e.restaurant, code: e.code || "" };
      localStorage.setItem(LS_PROFIL, JSON.stringify(profil));
      allerEcranPointage();
      return;
    }
  }
  /* Revalidation du profil : si le code de l'employé a changé (ou l'employé retiré), retour à l'accueil */
  if (!profil) return;
  const emp = await chargerEmployes();
  if (!emp.length) return;           // hors connexion : on garde le profil
  const e = emp.find(x => x.nom === profil.nom);
  if (!e || (e.code && e.code !== (profil.code || ""))) {
    localStorage.removeItem(LS_PROFIL);
    profil = null;
    allerEcranResto();
  }
})();
</script>
